[project]
name = "navi-tts-tools"
version = "0.1.0"
description = "Offline tools for navi-tts: HF safetensors -> .navi converter, PyTorch reference dumps"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    # reference dumps only; CPU torch on purpose (the GPU is shared with production,
    # and CPU is the deterministic reference anyway)
    "torch>=2.4",
    "torchaudio>=2.4",
    "qwen-tts>=0.1.1",
    "soundfile>=0.12",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
